name: sync-cn

# 镜像同步：把 GitHub 这份 master ＋ 全部 tag 单向推到三个国内仓（云效 Codeup / Gitee / GitCode）。
# 触发：master 有变动就同步（云效那份要随时新鲜，才当得了兜底），外加打 tag 与手动 dispatch。
#
# 前置（一次性）：
#   1. 三个目标仓存在（2026-11-01 现读：codeup opensource/flow-designer、gitee 与 gitcode 的
#      mldong/flow-designer 都在；GitCode 那份本工作流已首次铺满）
#   2. Gitee / GitCode 用组织级 secrets：GITEE_OWNER / GITEE_USERNAME / GITEE_TOKEN、GITCODE_OWNER / GITCODE_TOKEN
#      （组织 secrets 可见范围是"仅公开仓"，本仓已公开 ⇒ 可用）
#   3. 云效用**本仓自己的**两个 secrets：
#        CODEUP_SSH_KEY = 一把专用 SSH 私钥（GitHub 侧）
#        CODEUP_REPO    = 云效克隆地址（放 secret 里，是为了不把内网组织 ID 写进公开仓）
#      对应公钥要加在**对该仓有写权限的**云效账号上（云效 → 个人设置 → SSH 公钥）
#   详细步骤见 mldong-hub/docs/github-sync-cn.md
on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（master + 全部 tag）
        uses: actions/checkout@v4
        with:
          ref: master          # 显式检出 master：tag 触发时默认 detached HEAD，无 master 分支可 push
          fetch-depth: 0
          fetch-tags: true

      - name: Sync to 云效 Codeup
        env:
          CODEUP_SSH_KEY: ${{ secrets.CODEUP_SSH_KEY }}
          CODEUP_REPO: ${{ secrets.CODEUP_REPO }}
        run: |
          # 缺凭据判红而不是静默跳过：静默跳过会让人以为兜底那份源码是新鲜的
          if [ -z "$CODEUP_SSH_KEY" ] || [ -z "$CODEUP_REPO" ]; then
            echo "::error::未配置 CODEUP_SSH_KEY/CODEUP_REPO，云效未同步"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$CODEUP_SSH_KEY" > ~/.ssh/id_codeup
          chmod 600 ~/.ssh/id_codeup
          ssh-keyscan -t rsa,ecdsa,ed25519 codeup.aliyun.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_codeup -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git push --force --tags "$CODEUP_REPO" master

      - name: Sync to Gitee
        env:
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_OWNER" ] || [ -z "$GITEE_TOKEN" ]; then
            echo "::error::未配置 GITEE_OWNER/GITEE_TOKEN，Gitee 未同步"
            exit 1
          fi
          git push --force --tags \
            "https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/${GITEE_OWNER}/${{ github.event.repository.name }}.git" \
            master

      - name: Sync to GitCode
        env:
          GITCODE_OWNER: ${{ secrets.GITCODE_OWNER }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          if [ -z "$GITCODE_OWNER" ] || [ -z "$GITCODE_TOKEN" ]; then
            echo "::error::未配置 GITCODE_OWNER/GITCODE_TOKEN，GitCode 未同步"
            exit 1
          fi
          git push --force --tags \
            "https://oauth2:${GITCODE_TOKEN}@gitcode.com/${GITCODE_OWNER}/${{ github.event.repository.name }}.git" \
            master

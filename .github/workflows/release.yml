name: Release
# 从云效流水线搬过来的一条链：tag `v*.*.*` 一次发出两个包 ＋ 重建演示站。
# 发布走 npm Trusted Publishing（OIDC），仓里不需要长期 NPM_TOKEN；
# 前置（npm 网页侧，逐包一次）：包页 Access → Trusted Publisher → GitHub Actions
#   owner mldong / repository flow-designer / workflow name release.yml / environment 留空
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  setup:
    name: Assert tag matches package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF#refs/tags/}" = "$GITHUB_REF" ]; then
            echo "非 tag 触发（$GITHUB_REF），跳过 tag/版本一致性断言"
            exit 0
          fi
          [ "$GITHUB_REF_NAME" = "v$PKG" ] || { echo "tag $GITHUB_REF_NAME 与 package.json $PKG 不一致"; exit 1; }
          echo "待发布版本 = $PKG"

  publish-plus:
    name: Publish mldong-flow-designer-plus
      # 注意：这里刻意不给 setup-node 传 registry-url——传了它就会把组织里那枚 NPM_TOKEN 自动注成
      # NODE_AUTH_TOKEN，npm 见 token 就用 token，OIDC 通不通永远验不出来（11-01 探针实锤）。
      # npm 默认 registry 本就是 registry.npmjs.org，不需要它。
    needs: setup
    # 手工 dispatch 只重建演示站，不碰 npm：没有 tag 就不该发版（否则会把未 bump 的当前版本号推上去）
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Trusted Publishing 要求 npm CLI ≥ 11.5.1；node 22 自带 10.9.x
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build:lib
      - name: Verify build artifacts
        run: |
          test -f lib/mldong-flow-designer-plus.js
          test -f lib/mldong-flow-designer-plus.umd.cjs
          test -f lib/style.css
          node -e 'const p=require("./package.json");if(!p.files.includes("postinstall.mjs")){console.error("package.json files 缺 postinstall.mjs ⇒ 消费者 npm i 会 ENOENT 退 1");process.exit(1)}'
      - run: npm publish --access=public
        env: {}

  publish-lite:
    name: Publish mldong-flow-designer-dingtalk
    needs: setup
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11
      - run: npm ci
      # 脚本自己 build:lib:lite → 组装 dist-publish/ → npm publish（版本号取根 package.json，与双模式包同号）
      - run: node scripts/publish-lite.mjs --registry=https://registry.npmjs.org/
        env: {}

  deploy-demo:
    name: Deploy demo site
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      # 上传前断言产物非空：否则下面的 rm -rf dist 会把线上清成空站
      - name: Assert build output
        run: |
          test -f dist/index.html
          n=$(find dist -type f | wc -l)
          [ "$n" -ge 3 ] || { echo "dist 只有 $n 个文件，不像完整产物，拒绝部署"; exit 1; }
          echo "产物文件数=$n"
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      # 备份机制与文档站（jeeflow-doc release.yml）同形：替换前打时间戳 tar.gz，只留最近 3 份
      - name: Backup current site (keep last 3)
        run: |
          ssh root@${{ secrets.DEPLOY_HOST }} "cd /java_projects/flow-designer && \
            { [ -d dist ] && tar -czf dist-backup-\$(date +%Y%m%d-%H%M%S).tar.gz dist || true; } && \
            ls -1t dist-backup-*.tar.gz 2>/dev/null | tail -n +4 | xargs -r rm -f"
      - name: Deploy to flow-designer.mldong.com
        run: |
          tar -czf /tmp/fd-dist.tar.gz -C dist .
          scp /tmp/fd-dist.tar.gz root@${{ secrets.DEPLOY_HOST }}:/java_projects/flow-designer/
          ssh root@${{ secrets.DEPLOY_HOST }} "cd /java_projects/flow-designer && \
            rm -rf dist && mkdir -p dist && tar -xzf fd-dist.tar.gz -C dist && rm fd-dist.tar.gz"
          echo "✅ 演示站部署完成（保留备份 $(ssh root@${{ secrets.DEPLOY_HOST }} "ls -1 /java_projects/flow-designer/dist-backup-*.tar.gz 2>/dev/null | wc -l") 份）"
